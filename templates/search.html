<!DOCTYPE html>
<html>
<head>

<title>Tìm kiếm</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="container">

<h2>Tìm kiếm tài liệu</h2>

<form method="POST">

<input
type="text"
name="keyword"
placeholder="Nhập tên hoặc thể loại">

<button type="submit">
Tìm kiếm
</button>

</form>

<br>

<table>

<tr>   
<th>Tên tài liệu</th>
<th>Thể loại</th>
<th>Hành động</th>
</tr>

{% for doc in results %}

<tr>
<td>{{ doc.title }}</td>
<td>{{ doc.category }}</td>
<td>
    {% if doc.file_path %}
        <a href="{{ url_for('download_file', filename=doc.file_path) }}" class="btn-download">
            Tải về
        </a>
    {% else %}
        <span style="color: #999; font-size: 14px;">Không có file</span>
    {% endif %}
</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
